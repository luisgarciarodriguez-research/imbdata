[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imbdata"
version = "0.1.0"
description = "Centralized dataset repository for imbalanced classification benchmarks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Luis García Rodríguez", email = "luis.garcia@unam.edu" },
]
keywords = ["imbalanced-learning", "benchmark", "datasets", "fraud-detection", "class-imbalance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0,<3.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",  # reads the CWRU .mat vibration recordings
    "requests>=2.31",
    "tqdm>=4.66",
    "openml>=0.14",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["imbdata[kaggle,dev]"]

[project.scripts]
imbdata = "imbdata.cli:main"

[project.urls]
Repository = "https://github.com/luisgarciarodriguez-research/imbdata"

[tool.hatch.build.targets.wheel]
packages = ["src/imbdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration tests read the real data store. Datasets in the millions of
# rows (PaySim, CIC-IDS-2017, IEEE-CIS, SWAN-SF, BAF) and the whole-registry
# SHA-256 sweep are marked `slow` and skipped by default, which keeps a normal
# run to a few seconds. Run everything with:  pytest -m ""
addopts = "-m 'not slow'"
markers = [
    "slow: touches multi-gigabyte datasets or hashes the whole store",
]
