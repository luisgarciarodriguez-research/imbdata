# ═══════════════════════════════════════════════════════════════
# DOMAIN 9: SPACE WEATHER
# ═══════════════════════════════════════════════════════════════

swan_sf:
  domain: space_weather
  status: new
  source: harvard_dataverse
  url: https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/EBCFKM
  github_cleaned: https://github.com/samresume/Cleaned-SWANSF-Dataset
  target_column: label
  binarization: major_vs_nonflare  # M+X (1) vs FQ+B+C (0)
  preprocessing:
    type: mvts_feature_extraction
    parameters: 24  # magnetic field parameters
    timesteps: 60  # 12-min cadence over 12 hours
    statistics: [mean, std, min, max, skewness, kurtosis, slope, autocorr_lag1]
    result_features: 192  # 24 × 8
  cross_validation: use_5_partitions  # temporal partitions, no random split
  parameter_columns: [TOTUSJH, TOTBSQ, TOTPOT, TOTUSJZ, ABSNJZH, SAVNCPP, USFLUX, TOTFZ,
    MEANPOT, EPSZ, MEANSHR, SHRGT45, MEANGAM, MEANGBT, MEANGBZ, MEANGBH, MEANJZH, TOTFY,
    MEANJZD, MEANALP, TOTFX, EPSY, EPSX, R_VALUE]
  notes: "Alternative if features non-informative: use raw 24×60=1440 features.
    Instances are tab-separated CSVs of 60 timesteps inside per-partition tarballs,
    filed under FL/ (M and X flares) and NF/ (FQ, B and C). Partition 1 alone holds
    73,494 instances with 1,255 M+X, i.e. IR 57.6:1, which matches the ~60:1 of the
    PLAN.md table; the N≈4,075 of that table matches no partition-level reading."
  download:
    engine: dataverse
    doi: doi:10.7910/DVN/EBCFKM
    files:
      - url: https://dataverse.harvard.edu/api/access/datafile/3642446
        filename: partition1_instances.tar.gz
        extract: false
      - url: https://dataverse.harvard.edu/api/access/datafile/3642449
        filename: partition2_instances.tar.gz
        extract: false
      - url: https://dataverse.harvard.edu/api/access/datafile/3642433
        filename: partition3_instances.tar.gz
        extract: false
      - url: https://dataverse.harvard.edu/api/access/datafile/3642451
        filename: partition4_instances.tar.gz
        extract: false
      - url: https://dataverse.harvard.edu/api/access/datafile/3642450
        filename: partition5_instances.tar.gz
        extract: false

# ═══════════════════════════════════════════════════════════════
# DOMAIN 10: CROSS-DOMAIN (Digital Comms, Environmental, Social, Food, Marine)
# ═══════════════════════════════════════════════════════════════

spambase:
  domain: digital_communications
  status: new
  source: uci
  url: https://archive.ics.uci.edu/dataset/94/spambase
  filename: spambase.data
  target_column: class  # last column
  minority_value: 1  # spam
  features_drop: []
  encoding: none  # 57 continuous features
  imputation: none
  download:
    engine: http
    files:
      - url: https://archive.ics.uci.edu/static/public/94/spambase.zip
        extract: true
        expect: [spambase.data]

ozone_level:
  domain: environmental
  status: new
  source: uci
  url: https://archive.ics.uci.edu/dataset/172/ozone+level+detection
  filename: onehr.data  # 1-hour peak; matches the N=2,536 / IR 34:1 of PLAN.md
  variants: [eighthr]  # ozone_level__eighthr.parquet = 8-hour peak horizon
  variant_files:
    eighthr: eighthr.data
  target_column: class  # last column
  minority_value: 1  # ozone day
  features_drop: [date]
  encoding: none
  imputation: median  # has missing values marked as '?'
  notes: "UCI ships two labellings of the same 72 meteorological predictors over
    the same days: onehr applies the 1-hour peak ozone standard (N=2,536, 73
    ozone days, IR 33.7:1) and eighthr the 8-hour one (N=2,534, 160 ozone days,
    IR 14.8:1). The 1-hour horizon is the default because it matches the PLAN.md
    table and spreads the registry's IR coverage; the 8-hour horizon, which is
    the standard in force since the EPA revoked the 1-hour one in 2005, is kept
    as a variant. The pair isolates the effect of IR with every feature held
    constant."
  download:
    engine: http
    files:
      - url: https://archive.ics.uci.edu/static/public/172/ozone+level+detection.zip
        extract: true
        expect: [eighthr.data, onehr.data]

adult_census:
  domain: social_sciences
  status: new
  source: uci
  url: https://archive.ics.uci.edu/dataset/2/adult
  filename: [adult.data, adult.test]
  target_column: income
  minority_value: ">50K"
  majority_value: "<=50K"
  features_drop: []
  encoding:
    type: onehot
    columns: [workclass, education, marital-status, occupation, relationship, race, sex, native-country]
  imputation: mode  # missing values marked as ' ?' in categorical columns
  download:
    engine: http
    files:
      - url: https://archive.ics.uci.edu/static/public/2/adult.zip
        extract: true
        expect: [adult.data, adult.test]

wine_quality_red:
  domain: food_agriculture
  status: new
  source: uci
  url: https://archive.ics.uci.edu/dataset/186/wine+quality
  filename: winequality-red.csv
  target_column: quality
  binarization: quality_8_vs_rest  # quality=8 → 1, rest → 0 (KEEL standard)
  features_drop: []
  encoding: none  # 11 continuous physicochemical features
  imputation: none
  download:
    engine: http
    files:
      - url: https://archive.ics.uci.edu/static/public/186/wine+quality.zip
        extract: true
        expect: [winequality-red.csv]

abalone_19:
  domain: marine_biology
  status: new
  source: uci
  url: https://archive.ics.uci.edu/dataset/1/abalone
  filename: abalone.data
  target_column: rings
  binarization: rings_19_vs_rest  # rings=19 → 1, rest → 0 (KEEL standard)
  features_drop: []
  encoding:
    type: ordinal
    columns: [sex]  # M=0, F=1, I=2
  imputation: none
  download:
    engine: http
    files:
      - url: https://archive.ics.uci.edu/static/public/1/abalone.zip
        extract: true
        expect: [abalone.data]
