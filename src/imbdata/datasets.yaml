  filename: [UNSW_NB15_training-set.csv, UNSW_NB15_testing-set.csv]
  target_column: label  # 0=Normal, 1=Attack
  minority_value: 0  # Normal is minority in the full set; verify after loading
  features_drop: [id, attack_cat]  # attack_cat is the multi-class label
  encoding:
    type: onehot
    columns: [proto, service, state]
  imputation: none
  notes: "Use train+test combined (175,341 + 82,332 = 257,673). 9 attack types.
    Binary: Normal vs Attack. UNSW's own CloudStor host was decommissioned in
    2023 and the project page no longer links a download, so the files come
    from the Kaggle mirror of the official split."
  download:
    engine: kaggle
    slug: mrwellsdavid/unsw-nb15
    expect: [UNSW_NB15_training-set.csv, UNSW_NB15_testing-set.csv]

# ═══════════════════════════════════════════════════════════════
# DOMAIN 4: MANUFACTURING & INDUSTRY
# ═══════════════════════════════════════════════════════════════

cwru_bearing:
  domain: manufacturing
  status: existing
  source: cwru
  url: https://engineering.case.edu/bearingdatacenter/download-data-file
  target_column: condition
  binarization: normal_vs_fault
  minority_value: normal  # 230 normal windows vs 2,070 fault windows; see notes
  preprocessing:
    type: time_domain_feature_extraction
    sampling_rate_khz: 48
    channel: DE  # Drive End accelerometer
    load_hp: 1
    window: 2048
    overlap: 0
    windows_per_condition: 230
    statistics: [max, min, mean, sd, rms, skewness, kurtosis, crest, form]
    result_features: 9
  # CWRU Bearing Data Center file numbers: 48 kHz Drive End, motor load 1 HP.
  conditions:
    Normal_1: 98
    IR_007_1: 110
    Ball_007_1: 123
    OR_007_6_1: 136
    IR_014_1: 175
    Ball_014_1: 190
    OR_014_6_1: 202
    IR_021_1: 214
    Ball_021_1: 227
    OR_021_6_1: 239
  notes: "Pipeline recovered from the COMIA project
    (2026-2/statistical_analysis, experiments/validate_table2.py::load_cwru and
    datasets/09-Industrial-CWRU/feature_time_48k_2048_load_1.csv). N=2,300 (10
    conditions x 230 windows), d=9. Statistics use the SAMPLE standard deviation
    (ddof=1) as the denominator of the standardized moments, and kurtosis is
    excess (minus 3); crest = max/rms, form = rms/mean. Reproduced from the
    official CWRU files to ~5 significant digits against COMIA's CSV.
    POLARITY: COMIA encodes fault=1, but fault is the majority there (2,070 of
    2,300), which would break the canonical 0=majority/1=minority contract, so
    imbdata labels normal=1 (230, minority) and fault=0. Same partition of the
    same rows, labels swapped; IR 9:1, matching COMIA's own convention for its
    other industrial dataset."
  download:
    engine: http
    files:
      - url: https://engineering.case.edu/sites/default/files/98.mat
        filename: Normal_1_098.mat
      - url: https://engineering.case.edu/sites/default/files/110.mat
        filename: IR_007_1_110.mat
      - url: https://engineering.case.edu/sites/default/files/123.mat
        filename: Ball_007_1_123.mat
      - url: https://engineering.case.edu/sites/default/files/136.mat
        filename: OR_007_6_1_136.mat
      - url: https://engineering.case.edu/sites/default/files/175.mat
        filename: IR_014_1_175.mat
      - url: https://engineering.case.edu/sites/default/files/190.mat
        filename: Ball_014_1_190.mat
      - url: https://engineering.case.edu/sites/default/files/202.mat
        filename: OR_014_6_1_202.mat
      - url: https://engineering.case.edu/sites/default/files/214.mat
        filename: IR_021_1_214.mat
      - url: https://engineering.case.edu/sites/default/files/227.mat
        filename: Ball_021_1_227.mat
      - url: https://engineering.case.edu/sites/default/files/239.mat
        filename: OR_021_6_1_239.mat

seu_gearbox:
  domain: manufacturing
  status: existing
  source: github
  url: https://github.com/cathysiyu/Mechanical-datasets
  target_column: condition
  binarization: normal_vs_fault
  minority_value: normal  # 2 healthy conditions of 10; see notes
  preprocessing:
    type: fft_feature_extraction
    channel: 2  # planetary gearbox vibration, x direction (1-based column index)
    window: 256
    overlap: 0
    windows_per_file: 1000  # 10 recordings x 1,000 = COMIA's N=10,000 analysis budget
    random_state: 42
    result_features: 128  # rfft magnitude bins, window // 2
  # Southeast University gearset: 4 gear fault types plus healthy operation,
  # each recorded at two speed-load configurations (20 Hz-0 V and 30 Hz-2 V).
  conditions:
    Health_20_0: normal
    Health_30_2: normal
    Chipped_20_0: fault
    Chipped_30_2: fault
    Miss_20_0: fault
    Miss_30_2: fault
    Root_20_0: fault
    Root_30_2: fault
    Surface_20_0: fault
    Surface_30_2: fault
  notes: "Pipeline recovered from the COMIA project
    (2026-2/statistical_analysis, experiments/validate_table2.py::load_seu_gearbox):
    non-overlapping windows of 256 samples, rfft magnitude spectrum giving 128
    features, 250 windows drawn per file with numpy default_rng(42), healthy
    operation as the minority class.
    SOURCE NOTE: COMIA ran that pipeline over 40 CWRU 12 kHz bearing .mat files
    that sit in its 10-Industrial-SEU_Gearbox directory (their names are CWRU
    B/IR/OR codes, the folder's own 'Bearing-dataset' file credits the CWRU
    Bearing Data Center, and the loader keys on 'DE' = Drive End). imbdata
    instead serves the actual SEU gearset this key names, so the composition does
    not reproduce COMIA's Table 2: the SEU gearset has 10 recordings (2 healthy)
    rather than 40 (4 healthy), giving IR 4:1 instead of 9:1.
    windows_per_file is 1000 rather than COMIA's 250 because that 250 was
    arithmetic to reach N=10,000 across 40 files, not a property of the method;
    with 10 files the faithful equivalent is 1000, which lands on the same
    N=10,000 analysis budget that COMIA's _asymmetric_subsample() applies to its
    large datasets. Each recording holds 16,384 windows, so this uses 6.1% of
    what is available; the imbalance ratio does not depend on this parameter."
  download:
    engine: github
    files:
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Health_20_0.csv
        filename: Health_20_0.csv
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Health_30_2.csv
        filename: Health_30_2.csv
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Chipped_20_0.csv
        filename: Chipped_20_0.csv
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Chipped_30_2.csv
        filename: Chipped_30_2.csv
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Miss_20_0.csv
        filename: Miss_20_0.csv
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Miss_30_2.csv
        filename: Miss_30_2.csv
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Root_20_0.csv
        filename: Root_20_0.csv
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Root_30_2.csv
        filename: Root_30_2.csv
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Surface_20_0.csv
        filename: Surface_20_0.csv
      - url: https://raw.githubusercontent.com/cathysiyu/Mechanical-datasets/master/gearbox/gearset/Surface_30_2.csv
        filename: Surface_30_2.csv

secom:
  domain: manufacturing
  status: new
  source: uci
  url: https://archive.ics.uci.edu/dataset/179/secom
  filename: [secom.data, secom_labels.data]
  target_column: label
  minority_value: 1  # fail/defective
  majority_value: -1  # pass
  features_drop: []  # start with all 590
  encoding: none
  imputation:
    method: median
    drop_threshold: 0.50  # drop features with >50% missing
  notes: "590 features, ~4.4% missing. d >> N regime. Record final d in manifest."
  download:
    engine: http
    files:
      - url: https://archive.ics.uci.edu/static/public/179/secom.zip
        extract: true
        expect: [secom.data, secom_labels.data]

