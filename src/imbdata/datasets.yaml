  source: cic_unb
  url: https://www.unb.ca/cic/datasets/ids-2017.html
  filename: "*.csv"  # multiple CSV files, one per day
  target_column: " Label"  # note leading space in original
  binarization: normal_vs_attack  # BENIGN (0) vs. all attacks (1)
