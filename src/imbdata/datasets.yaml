# CIPA Extended — Dataset Configuration
# Each entry defines download source, preprocessing, and binarization for one dataset.
# Used by: src/download_datasets.py, src/preprocess.py, src/load_dataset.py

# ═══════════════════════════════════════════════════════════════
# DOMAIN 1: FINANCIAL FRAUD
# ═══════════════════════════════════════════════════════════════

credit_card_fraud:
  domain: financial_fraud
  status: existing  # from COMIA 2026
  source: kaggle
  url: https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud
  filename: creditcard.csv
  target_column: Class
  minority_value: 1
  features_drop: []
  encoding: none  # all numeric (PCA-transformed)
  imputation: none  # no missing values
  notes: "PCA-transformed V1–V28. Only Time and Amount are original."
  fraud:
    time:
      column: Time
      unit: second
      calendar: false
      origin: first_transaction  # seconds elapsed since the first transaction
    amount:
      column: Amount
    graph: null   # no counterparty identifiers are published
    entity: null  # no cardholder or account identifier is published
    synthetic: false
  license:
    name: DbCL 1.0
    spdx: DbCL-1.0
    status: declared
    url: https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud
    restrictions: []
    cite: "Dal Pozzolo, Caelen, Johnson and Bontempi (2015), IEEE CIDM"
    notes: "Owner: the Machine Learning Group of ULB with Worldline, who collected the
      data. DbCL covers the contents of a database released under ODbL, so an
      ODbL attribution notice is advisable."
    checked: "2026-09-16"

paysim:
  domain: financial_fraud
  status: existing
  source: kaggle
  url: https://www.kaggle.com/datasets/ealaxi/paysim1
  filename: PS_20174392719_1491204439457_log.csv
  target_column: isFraud
  minority_value: 1
  features_drop: [nameOrig, nameDest, isFlaggedFraud]
  encoding:
    type: onehot  # column 'type' has 5 categories
    columns: [type]
  imputation: none
  temporal_column: step
  notes: "Synthetic. Only TRANSFER and CASH_OUT have fraud. step = temporal ordering."
  fraud:
    time:
      column: step
      unit: hour
      calendar: false
      origin: simulation_start  # 744 simulated hours, no calendar anchor
    amount:
      column: amount
    graph:
      kind: account
      src: nameOrig
      dst: nameDest
    entity: nameOrig
    synthetic: true
  license:
    name: CC BY-SA 4.0
    spdx: CC-BY-SA-4.0
    status: declared
    url: https://www.kaggle.com/datasets/ealaxi/paysim1
    restrictions: [share_alike]
    cite: "Lopez-Rojas, Elmir and Axelsson (2016)"
    notes: "Owner taken from the Kaggle dataset metadata (the uploading account); not
      cross-checked against an independent source."
    checked: "2026-09-16"

ieee_cis_fraud:
  domain: financial_fraud
  status: existing
  source: kaggle
  url: https://www.kaggle.com/c/ieee-fraud-detection
  filename: [train_transaction.csv, train_identity.csv]
  target_column: isFraud
  minority_value: 1
  features_drop: [TransactionID]
  encoding:
    type: onehot_or_ordinal  # mixed categorical columns
    columns: [ProductCD, card4, card6, P_emaildomain, R_emaildomain, M1-M9, DeviceType, DeviceInfo, id_12-id_38]
  imputation: median  # high percentage of missing values
  temporal_column: TransactionDT
  notes: "Join Transaction + Identity on TransactionID. 434 features after join. High missingness."
  fraud:
    time:
      column: TransactionDT
      unit: second
      calendar: false
      origin: unpublished  # the reference date was never released by the organisers
    amount:
      column: TransactionAmt
    graph: null   # no counterparty identifiers; card/addr surrogates are the consumer's choice
    entity: null
    synthetic: false
  license:
    name: Kaggle competition rules (IEEE-CIS / Vesta)
    spdx: null
    status: owner_terms
    url: https://www.kaggle.com/competitions/ieee-fraud-detection/rules
    restrictions: [non_commercial, no_redistribution]
    cite: null
    notes: "Section 7.A limits use to 'non-commercial purposes only, including ...
      academic research and education'; section 7.B forbids redistributing
      the data. Each user must accept the rules on Kaggle before
      downloading."
    checked: "2026-09-16"

elliptic_bitcoin:
  domain: financial_fraud
  status: new
  source: kaggle
  url: https://www.kaggle.com/datasets/ellipticco/elliptic-data-set
  filename: [elliptic_txs_features.csv, elliptic_txs_classes.csv, elliptic_txs_edgelist.csv]
  target_column: class
  # Verified against elliptic_txs_classes.csv: class 1 has 4,545 rows (illicit)
  # and class 2 has 42,019 (licit). The original comment had the mapping
  # inverted, which produced an IR of 0.1:1 instead of 9.2:1.
  minority_value: "1"  # 1=illicit, 2=licit, unknown=dropped
  majority_value: "2"
  drop_unlabeled: true  # drop class="unknown"
  features_drop: []  # 165 features, use all
  encoding: none  # all numeric
  imputation: none
  temporal_column: time_step  # 49 timesteps
  notes: "Use only labeled nodes (46,564 of 203,769). Ignore graph structure for CIPA."
  fraud:
    time:
      column: time_step
      unit: step     # 49 two-week windows; not convertible to seconds
      calendar: false
      origin: unpublished
    amount: null     # the anonymized features do not expose a transaction amount
    graph:
      kind: transaction
      edges: elliptic_txs_edgelist.csv
    entity: null
    synthetic: false
  license:
    name: CC BY-NC-ND 4.0
    spdx: CC-BY-NC-ND-4.0
    status: declared
    url: https://www.kaggle.com/datasets/ellipticco/elliptic-data-set
    restrictions: [non_commercial, no_derivatives]
    cite: null
    notes: "Owner taken from the Kaggle dataset metadata (the uploading account); not
      cross-checked against an independent source."
    checked: "2026-09-16"

baf:
  domain: financial_fraud
  status: new
  source: kaggle
  url: https://www.kaggle.com/datasets/sgpjesus/bank-account-fraud-dataset-neurips-2022
  github: https://github.com/feedzai/bank-account-fraud
  filename: Base.csv  # Use the Base variant
  target_column: fraud_bool
  minority_value: 1
  features_drop: []
  encoding:
    type: onehot
    columns: [payment_type, employment_status, housing_status, source, device_os]
  imputation: none
  temporal_column: month  # 8 months, Feb–Sep
  notes: "NeurIPS 2022 benchmark. Base variant. 1M records. Temporal drift built in."
  license:
    name: CC BY-NC-SA 4.0
    spdx: CC-BY-NC-SA-4.0
    status: declared
    url: https://www.kaggle.com/datasets/sgpjesus/bank-account-fraud-dataset-neurips-2022
    restrictions: [non_commercial, share_alike]
    cite: "Jesus et al. (2022), NeurIPS Datasets and Benchmarks Track"
    notes: "Owner taken from the Kaggle dataset metadata (the uploading account); not
      cross-checked against an independent source."
    checked: "2026-09-16"

saml_d:
  domain: financial_fraud
  status: new
  source: kaggle
  url: https://www.kaggle.com/datasets/berkanoztas/synthetic-transaction-monitoring-dataset-aml
  filename: SAML-D.csv
  target_column: Is_laundering
  minority_value: 1
  # Sender_account/Receiver_account are surrogate keys (same criterion as
  # nameOrig/nameDest in paysim); Laundering_type is the typology, so it leaks
  # the target (same criterion as attack_cat in unsw_nb15). Date and Time are
  # consumed by the preprocessor into the numeric `timestamp` column.
  features_drop: [Sender_account, Receiver_account, Laundering_type]
  encoding:
    type: onehot  # 13 + 13 + 18 + 18 + 7 levels; none exceeds 50
    columns: [Payment_type, Payment_currency, Received_currency,
              Sender_bank_location, Receiver_bank_location]
  imputation: none  # no missing values in any column
  temporal_column: timestamp  # Date + Time combined into Unix seconds (UTC)
  notes: "Synthetic AML transaction monitoring data with 28 typologies (11 normal
    and 17 suspicious) in Laundering_type, which is dropped as target leakage.
    The Kaggle version is an updated version compared to the paper. No native
    concept drift: any drift used with SAML-D is researcher-constructed."
  license:
    name: CC BY-NC-SA 4.0
    spdx: CC-BY-NC-SA-4.0
    status: declared
    url: https://www.kaggle.com/datasets/berkanoztas/synthetic-transaction-monitoring-dataset-aml
    restrictions: [non_commercial, share_alike]
    cite: "Oztas et al. IEEE ICEBE 2023"
    notes: "Owner taken from the Kaggle dataset metadata (the uploading account); not
      cross-checked against an independent source. DOI 10.1109/ICEBE59045.2023.00028 as
      given in the Kaggle description; not verified against Crossref."
    checked: "2026-09-17"
  fraud:
    time:
      column: timestamp      # derived by the reader from the raw Date and Time
      source: [Date, Time]
      unit: second
      calendar: true
      origin: unix_epoch     # absolute Unix seconds, read as UTC
    amount:
      column: Amount
      currency: Payment_currency
    graph:
      kind: account
      src: Sender_account
      dst: Receiver_account
    entity: Sender_account
    synthetic: true
    typology: Laundering_type
    drift_provenance: researcher_constructed

