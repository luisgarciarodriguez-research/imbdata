        filename: partition1_instances.tar.gz
        extract: false
      - url: https://dataverse.harvard.edu/api/access/datafile/3642449
        filename: partition2_instances.tar.gz
        extract: false
      - url: https://dataverse.harvard.edu/api/access/datafile/3642433
        filename: partition3_instances.tar.gz
        extract: false
      - url: https://dataverse.harvard.edu/api/access/datafile/3642451
        filename: partition4_instances.tar.gz
        extract: false
