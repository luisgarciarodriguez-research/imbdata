# CIPA Extended — Dataset Configuration
# Each entry defines download source, preprocessing, and binarization for one dataset.
# Used by: src/download_datasets.py, src/preprocess.py, src/load_dataset.py

# ═══════════════════════════════════════════════════════════════
# DOMAIN 1: FINANCIAL FRAUD
# ═══════════════════════════════════════════════════════════════

credit_card_fraud:
  domain: financial_fraud
  status: existing  # from COMIA 2026
  source: kaggle
  url: https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud
  filename: creditcard.csv
  target_column: Class
  minority_value: 1
  features_drop: []
  encoding: none  # all numeric (PCA-transformed)
  imputation: none  # no missing values
  notes: "PCA-transformed V1–V28. Only Time and Amount are original."

paysim:
  domain: financial_fraud
  status: existing
  source: kaggle
  url: https://www.kaggle.com/datasets/ealaxi/paysim1
  filename: PS_20174392719_1491204439457_log.csv
  target_column: isFraud
  minority_value: 1
  features_drop: [nameOrig, nameDest, isFlaggedFraud]
  encoding:
    type: onehot  # column 'type' has 5 categories
    columns: [type]
  imputation: none
  temporal_column: step
  notes: "Synthetic. Only TRANSFER and CASH_OUT have fraud. step = temporal ordering."

ieee_cis_fraud:
  domain: financial_fraud
  status: existing
  source: kaggle
  url: https://www.kaggle.com/c/ieee-fraud-detection
  filename: [train_transaction.csv, train_identity.csv]
  target_column: isFraud
  minority_value: 1
  features_drop: [TransactionID]
  encoding:
    type: onehot_or_ordinal  # mixed categorical columns
    columns: [ProductCD, card4, card6, P_emaildomain, R_emaildomain, M1-M9, DeviceType, DeviceInfo, id_12-id_38]
  imputation: median  # high percentage of missing values
  temporal_column: TransactionDT
  notes: "Join Transaction + Identity on TransactionID. 434 features after join. High missingness."

elliptic_bitcoin:
  domain: financial_fraud
  status: new
  source: kaggle
  url: https://www.kaggle.com/datasets/ellipticco/elliptic-data-set
  filename: [elliptic_txs_features.csv, elliptic_txs_classes.csv, elliptic_txs_edgelist.csv]
  target_column: class
  # Verified against elliptic_txs_classes.csv: class 1 has 4,545 rows (illicit)
  # and class 2 has 42,019 (licit). The original comment had the mapping
  # inverted, which produced an IR of 0.1:1 instead of 9.2:1.
  minority_value: "1"  # 1=illicit, 2=licit, unknown=dropped
  majority_value: "2"
  drop_unlabeled: true  # drop class="unknown"
  features_drop: []  # 165 features, use all
  encoding: none  # all numeric
  imputation: none
  temporal_column: time_step  # 49 timesteps
  notes: "Use only labeled nodes (46,564 of 203,769). Ignore graph structure for CIPA."

baf:
  domain: financial_fraud
  status: new
  source: kaggle
  url: https://www.kaggle.com/datasets/sgpjesus/bank-account-fraud-dataset-neurips-2022
  github: https://github.com/feedzai/bank-account-fraud
  filename: Base.csv  # Use the Base variant
  target_column: fraud_bool
  minority_value: 1
  features_drop: []
  encoding:
    type: onehot
    columns: [payment_type, employment_status, housing_status, source, device_os]
  imputation: none
  temporal_column: month  # 8 months, Feb–Sep
  notes: "NeurIPS 2022 benchmark. Base variant. 1M records. Temporal drift built in."

# ═══════════════════════════════════════════════════════════════
# DOMAIN 2: MEDICINE & CLINICAL
# ═══════════════════════════════════════════════════════════════

breast_cancer_wisconsin:
  domain: medicine
  status: existing
  source: uci
  url: https://archive.ics.uci.edu/dataset/17/breast+cancer+wisconsin+diagnostic
  filename: wdbc.data
  target_column: diagnosis
  minority_value: M  # Malignant
  majority_value: B  # Benign
  features_drop: [id]
  encoding: none
  imputation: none
  download:
    engine: http
    files:
      - url: https://archive.ics.uci.edu/static/public/17/breast+cancer+wisconsin+diagnostic.zip
        extract: true
        expect: [wdbc.data]

pima_diabetes:
  domain: medicine
  status: existing
  source: kaggle
  url: https://www.kaggle.com/datasets/uciml/pima-indians-diabetes-database
  filename: diabetes.csv
  target_column: Outcome
  minority_value: 1
  features_drop: []
  encoding: none
  imputation: none  # zeros are biologically implausible but standard practice is to keep them
  notes: "Zero values in Glucose, BloodPressure, SkinThickness, Insulin, BMI are likely encoded missing.
    The declared Kaggle slug returns 403 and no longer appears in Kaggle search, i.e. the dataset was
    delisted or restricted by its owner; this is not a credentials problem (other Kaggle datasets in
    this registry download fine with the same token). The declared download.mirror is used instead and
    yields the same N=768 with 500/268."
  download:
    engine: kaggle
    slug: uciml/pima-indians-diabetes-database
    expect: [diabetes.csv]
    mirror:
      engine: http
      files:
        - url: https://raw.githubusercontent.com/plotly/datasets/master/diabetes.csv
          filename: diabetes.csv

tcga_brca:
  domain: medicine
  status: existing
  source: linkedomics
  url: https://www.linkedomics.org/data_download/TCGA-BRCA/
  filename: Human__TCGA_BRCA__UNC__RNAseq__HiSeq_RNA__01_28_2016__BI__Gene__Firehose_RSEM_log2.cct.gz
  target_column: pam50_subtype  # derived from clinical data
  minority_value: Basal
  binarization: basal_vs_rest  # Basal-like (minority) vs. all other PAM50 subtypes
  features_drop: []
  encoding: none  # gene expression values are continuous
  imputation: none
  dimensionality_filter:
    method: variance
    top_k: 5000  # for distance-based CIPA measures (D₂, D₃, D₄, D₇)
  variants: [full]  # tcga_brca.parquet = top-5,000; tcga_brca__full.parquet = all genes
  clinical_filename: Human__TCGA_BRCA__MS__Clinical__Clinical__01_28_2016__BI__Clinical__Firehose.tsi
  notes: "d_full ~20,500 used for D₁, D₅, D₆. d_filtered=5,000 for D₂, D₃, D₄, D₇.
    The LinkedOmics matrix is already log2(RSEM+1)-transformed (see the file name),
    so preprocessing does not re-apply the transform.
    DIVERGENCE FROM COMIA, deliberate: that project keeps the top 2,000 genes and
    treats Basal+Her2 as the minority (214 of 826, IR 2.9:1). This registry follows
    the PLAN.md binarization protocol — Basal-like against all other PAM50 subtypes
    (147 of 826, IR 4.6:1) — which also matches the ~5.5:1 of the PLAN.md table read
    as N/minority, and keeps Basal-like as the harder, clinically distinct minority
    that the literature uses. Both projects read the same 826 samples: the four
    subtypes COMIA retains are the complete set with a PAM50 call."
  download:
    engine: http
    files:
      - url: https://www.linkedomics.org/data_download/TCGA-BRCA/Human__TCGA_BRCA__UNC__RNAseq__HiSeq_RNA__01_28_2016__BI__Gene__Firehose_RSEM_log2.cct.gz
        extract: true
        expect: [Human__TCGA_BRCA__UNC__RNAseq__HiSeq_RNA__01_28_2016__BI__Gene__Firehose_RSEM_log2.cct]
      - url: https://www.linkedomics.org/data_download/TCGA-BRCA/Human__TCGA_BRCA__MS__Clinical__Clinical__01_28_2016__BI__Clinical__Firehose.tsi
        filename: Human__TCGA_BRCA__MS__Clinical__Clinical__01_28_2016__BI__Clinical__Firehose.tsi

mammography:
  domain: medicine
  status: new
  source: openml
  url: https://www.openml.org/d/310
  openml_id: 310
  target_column: class
  minority_value: "1"  # calcification present
  features_drop: []
  encoding: none
  imputation: none
  notes: "6 features extracted from mammogram images. IR=42:1."
  download:
    engine: openml

